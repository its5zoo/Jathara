<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2119" />
      <stop offset="50%" stop-color="#103327" />
      <stop offset="100%" stop-color="#061611" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be9740" />
      <stop offset="50%" stop-color="#d6b25e" />
      <stop offset="100%" stop-color="#f5e1a4" />
    </linearGradient>
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07a52" />
      <stop offset="100%" stop-color="#c25e38" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#143e30" />
      <stop offset="100%" stop-color="#2d7a60" />
    </linearGradient>
  </defs>

  <!-- Forest Green Rounded Badge Background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.55" />

  <!-- Botanical Roots & Dandakaranya Seedling Arch -->
  <!-- Left Sprout (Terracotta Earth) -->
  <path d="M16 25.5 C13 24 10.5 21 10.5 17.5 C10.5 14 13.5 12 16 12 C14.2 14.5 13.8 18 16 21 Z" fill="url(#terraGrad)" />

  <!-- Right Sprout (Growth & Innovation Forest Wing) -->
  <path d="M16 25.5 C19 24 21.5 21 21.5 17.5 C21.5 14 18.5 12 16 12 C17.8 14.5 18.2 18 16 21 Z" fill="url(#leafGrad)" />

  <!-- Central Ascending Innovation Spire / Flame (Gold) -->
  <path d="M16 5.5 L19.2 14.2 C18.2 13.5 17.2 13 16 13 C14.8 13 13.8 13.5 12.8 14.2 Z" fill="url(#goldGrad)" />

  <!-- Summit Star / Innovation Apex (Ivory & Gold) -->
  <circle cx="16" cy="6.2" r="1.4" fill="#fcfbf8" />
  <polygon points="16,3.8 16.8,5.8 18.8,6.2 16.8,6.6 16,8.6 15.2,6.6 13.2,6.2 15.2,5.8" fill="url(#goldGrad)" />

  <!-- Foundation Root Knot (Deep Gold Anchor) -->
  <circle cx="16" cy="24.8" r="1.3" fill="#d6b25e" />
</svg>
